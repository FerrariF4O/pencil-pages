name: PencilPages
options:
  bundleIdPrefix: app.openpencil
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Pencil Pages"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    SUPPORTS_MACCATALYST: NO
targets:
  PencilPages:
    type: application
    platform: iOS
    sources:
      - path: Sources/PencilPages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openpencil.PencilPages
  PencilPagesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PencilPagesTests
    dependencies:
      - target: PencilPages
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openpencil.PencilPagesTests
schemes:
  PencilPages:
    build:
      targets:
        PencilPages: all
    test:
      targets:
        - PencilPagesTests
